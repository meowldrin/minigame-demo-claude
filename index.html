<!-- CGD-1: project entry point -->
<!-- CGD-9: adds HUD and game-over overlay -->
<!-- CGD-24: inventory overlay -->
<!-- CGD-42: virtual D-pad for touch devices -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roguelike</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-wrapper">
      <div id="hud">
        <span id="hud-hp">HP: 10</span>
        <span id="hud-atk">ATK: 1</span>
        <span id="hud-def">DEF: 0</span>
        <span id="hud-floor">Floor: 1</span>
        <span id="hud-turn">Turn: 0</span>
      </div>
      <div id="game-container"></div>
      <div id="controls">WASD / ↑↓←→ to move &nbsp;·&nbsp; step on &gt; to descend &nbsp;·&nbsp; I = inventory</div>
    </div>
    <div id="dpad">
      <button class="dpad-btn" id="dpad-up">↑</button>
      <button class="dpad-btn" id="dpad-left">←</button>
      <button class="dpad-btn" id="dpad-right">→</button>
      <button class="dpad-btn" id="dpad-down">↓</button>
      <button class="dpad-btn" id="dpad-inv">I</button>
    </div>
    <div id="inventory" class="hidden"></div>
    <div id="game-over" class="hidden">
      <p>GAME OVER</p>
      <p id="game-over-turns"></p>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
